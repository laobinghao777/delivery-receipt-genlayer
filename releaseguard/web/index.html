<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ReleaseGuard · 发布证据核验</title><link rel="stylesheet" href="/style.css"><main><header><small>GENLAYER · BRADBURY</small><h1>ReleaseGuard</h1><p>公告里的功能承诺，有正式发布证据吗？</p></header><aside>核验范围：GitHub 发布说明是否支持声明。发布说明不代表代码实现或安全保证。</aside><section><h2>新建核验</h2><form id="create"><label>GitHub 所有者<input name="owner" required placeholder="nodejs"></label><label>仓库<input name="repo" required placeholder="node"></label><label>精确发布标签<input name="tag" required placeholder="v22.0.0"></label><label>待核验声明<textarea name="claim" required minlength="10" maxlength="1000" placeholder="该版本默认启用了……"></textarea></label><button>提交核验声明</button></form></section><section><h2>证据与结论</h2><p id="status">连接中…</p><button id="refresh">刷新链上状态</button><div id="records"></div></section><footer id="network"></footer></main><script type="module" src="/app.js"></script></html>
